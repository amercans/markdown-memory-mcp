version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    ignore:
      # mcp 2.x removed mcp.server.fastmcp; moving to it is a code change, not a version bump.
      - dependency-name: mcp
        update-types: ["version-update:semver-major"]

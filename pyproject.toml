[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "markdown-memory-mcp"
version = "0.2.0"
description = "Semantic recall for a Markdown memory vault: a Claude Code hook, a vault linter and an MCP server."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["markdown", "obsidian", "mcp", "mcp>=1.2,<3", "linter", "memory", "search", "bm25", "embeddings", "claude-code"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Indexing",
]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
embed = ["fastembed>=0.4", "numpy>=1.26"]
mcp = ["mcp>=1.2,<3"]
all = ["fastembed>=0.4", "numpy>=1.26", "mcp>=1.2,<3"]

[project.scripts]
markdown-memory-mcp = "markdown_memory_mcp.cli:main"

[project.urls]
Homepage = "https://github.com/amercans/markdown-memory-mcp"
Issues = "https://github.com/amercans/markdown-memory-mcp/issues"
Changelog = "https://github.com/amercans/markdown-memory-mcp/blob/main/CHANGELOG.md"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "fastembed>=0.4", "numpy>=1.26", "mcp>=1.2,<3", "types-PyYAML"]

[tool.hatch.build.targets.wheel]
packages = ["src/markdown_memory_mcp"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "CHANGELOG.md", "ARCHITECTURE.md"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["RUF001"]  # Turkish sample text is intentional

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not slow'"
markers = ["slow: loads the real embedding model (downloads it on first use)"]

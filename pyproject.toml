[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "vault-recall"
version = "0.1.0"
description = "Hybrid recall, lint and MCP server for a folder of Markdown notes used as an AI assistant's long-term memory."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["markdown", "obsidian", "mcp", "search", "bm25", "embeddings", "claude-code"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Indexing",
]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
embed = ["fastembed>=0.4", "numpy>=1.26"]
mcp = ["mcp>=1.2,<2"]
all = ["fastembed>=0.4", "numpy>=1.26", "mcp>=1.2,<2"]

[project.scripts]
vault-recall = "vault_recall.cli:main"

[project.urls]
Homepage = "https://github.com/amercans/vault-recall"
Issues = "https://github.com/amercans/vault-recall/issues"
Changelog = "https://github.com/amercans/vault-recall/blob/main/CHANGELOG.md"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "fastembed>=0.4", "numpy>=1.26", "mcp>=1.2,<2", "types-PyYAML"]

[tool.hatch.build.targets.wheel]
packages = ["src/vault_recall"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "CHANGELOG.md", "ARCHITECTURE.md"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["RUF001"]  # Turkish sample text is intentional

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not slow'"
markers = ["slow: loads the real embedding model (downloads it on first use)"]
